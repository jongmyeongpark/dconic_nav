#!/usr/bin/env python3
PACKAGE = "pointcloud_height_filter"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("enabled",              bool_t,   0, "Enable height filter (false = pass-through)", True)
gen.add("camera_height",        double_t, 0, "Camera optical center height above floor (m)", 1.177, 0.0, 3.0)
gen.add("camera_pitch",         double_t, 0, "Camera downward tilt angle (radians, + = tilt down)", 0.0, -0.5, 0.5)
gen.add("min_obstacle_height",  double_t, 0, "Minimum world-frame obstacle height to keep (m)", 0.10, 0.0, 2.0)
gen.add("max_obstacle_height",  double_t, 0, "Maximum world-frame obstacle height to keep (m)", 1.80, 0.0, 3.0)

exit(gen.generate(PACKAGE, "pointcloud_height_filter", "HeightFilter"))
