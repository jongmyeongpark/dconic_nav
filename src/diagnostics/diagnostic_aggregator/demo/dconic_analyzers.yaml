analyzers:
  motors:
    type: diagnostic_aggregator/GenericAnalyzer
    path: md
    startswith: 'EtherCAT'
  sensors:
    type: diagnostic_aggregator/AnalyzerGroup
    path: Sensors
    analyzers:
      lidar:
        type: diagnostic_aggregator/GenericAnalyzer
        path: gl_ros_driver
        timeout: 5.0
        contains: scan
        num_items: 2      
      imu:
        type: diagnostic_aggregator/GenericAnalyzer
        path: razor_imu_9dof
        timeout: 5.0
        contains: Razor
        num_items: 1
